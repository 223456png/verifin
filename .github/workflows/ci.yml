name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff>=0.6.0"

      - name: Ruff check
        run: ruff check src tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # 测试全程离线：不访问 HuggingFace Hub，也不调用任何外部 LLM API
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q --cov=verifin --cov-report=term-missing

      - name: MCP Server 可导入性冒烟
        # 不需要索引：mcp.server 惰性加载，导入不应触发检索环境初始化
        run: |
          python - <<'PY'
          from verifin.mcp import server
          for name in ("mcp", "retrieve", "expand_document", "verify_claim", "calculate"):
              assert hasattr(server, name), f"missing MCP tool: {name}"
          print("mcp server import ok")
          PY
