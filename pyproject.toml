[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifin"
version = "0.1.0"
description = "VeriFin — Financial Evidence Verification Agent (Phase 1: ingestion + indexing)"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "loguru>=0.7.2",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
bge = [
    "sentence-transformers>=3.0.0",
]
rerank = [
    "sentence-transformers>=3.0.0",
]
bge-reranker = [
    "FlagEmbedding>=1.2.0",
]
dev = [
    "pytest>=8.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verifin = ["inheritance_rules.json", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]